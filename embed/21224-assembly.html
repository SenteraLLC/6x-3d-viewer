<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sentera 6X Sensor Assembly — Interactive 3D Model</title>
<link rel="alternate" type="application/json+oembed"
      href="https://senterallc.github.io/6x-3d-viewer/oembed/21224-assembly.json"
      title="Sentera 6X Sensor Assembly — Interactive 3D Model">
<meta property="og:title" content="Sentera 6X Sensor Assembly — Interactive 3D Model">
<meta property="og:type" content="website">
<meta property="og:url" content="https://senterallc.github.io/6x-3d-viewer/embed/21224-assembly.html">
<script type="module" src="https://unpkg.com/@google/model-viewer@4.3.1/dist/model-viewer.min.js"></script>
<style>
  :root { color-scheme: light dark; }
  html, body { margin: 0; padding: 0; height: 100%; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  #wrap { position: relative; width: 100%; height: 100vh; min-height: 420px; }
  model-viewer { width: 100%; height: 100%; --poster-color: transparent; background: #f5f6f8; }
  .hotspot {
    background: #2563eb; width: 18px; height: 18px; border-radius: 50%;
    border: 2px solid #fff; box-shadow: 0 0 0 2px rgba(37,99,235,0.4), 0 1px 4px rgba(0,0,0,0.4);
    cursor: pointer; transition: transform .15s ease; padding: 0; position: relative;
  }
  .hotspot:hover, .hotspot:focus { transform: scale(1.25); }
  .hotspot-label {
    position: absolute; left: 100%; top: 50%; transform: translate(10px, -50%);
    background: rgba(17,24,39,0.92); color: #fff; padding: 6px 10px; border-radius: 6px;
    font-size: 13px; line-height: 1.35; max-width: 220px; pointer-events: none;
    display: none; white-space: normal; text-align: left;
  }
  .hotspot-label strong { display: block; font-size: 13px; margin-bottom: 2px; }
  .hotspot-label span { font-size: 12px; opacity: .85; }
  .hotspot:hover .hotspot-label, .hotspot.expanded .hotspot-label { display: block; }
  #toolbar { position: absolute; top: 10px; left: 10px; z-index: 10; display: flex; gap: 8px; flex-wrap: wrap; }
  #toolbar button { background: #111827e6; color: #fff; border: none; border-radius: 6px; padding: 6px 10px; font-size: 12px; cursor: pointer; }
  #toolbar button.active { background: #2563eb; }
  #editPanel {
    position: absolute; bottom: 10px; left: 10px; right: 10px; z-index: 10;
    background: rgba(17,24,39,0.92); color: #fff; border-radius: 8px;
    padding: 10px 12px; font-size: 12px; display: none; max-height: 40%; overflow: auto;
  }
  #editPanel.show { display: block; }
  #editPanel textarea {
    width: 100%; height: 120px; margin-top: 6px; font-family: monospace; font-size: 11px;
    background: #0b0f1a; color: #d1d5db; border: 1px solid #374151; border-radius: 4px;
  }
  #editPanel code { color: #93c5fd; }
</style>
</head>
<body>
<div id="wrap">
  <model-viewer id="mv" src="../models/21224-00_STEP_ASSEMBLY.opt.glb"
    camera-controls touch-action="pan-y" exposure="1" shadow-intensity="0.6"
    interaction-prompt="none" ar>
  </model-viewer>
  <div id="toolbar">
    <button id="resetBtn">Reset View</button>
    <button id="editBtn">Edit Hotspots</button>
  </div>
  <div id="editPanel">
    <div>Edit mode: click anywhere on the model to log the 3D position under the cursor. Copy the JSON below into <code>hotspots-21224-assembly.json</code> to adjust a hotspot.</div>
    <textarea id="editOutput" readonly placeholder="Click on the model..."></textarea>
  </div>
</div>
<script>
const mv = document.getElementById('mv');
let editMode = false;
const editBtn = document.getElementById('editBtn');
const editPanel = document.getElementById('editPanel');
const editOutput = document.getElementById('editOutput');

editBtn.addEventListener('click', () => {
  editMode = !editMode;
  editBtn.classList.toggle('active', editMode);
  editPanel.classList.toggle('show', editMode);
});

document.getElementById('resetBtn').addEventListener('click', () => {
  mv.cameraOrbit = '0deg 75deg 105%';
  mv.cameraTarget = 'auto auto auto';
});

mv.addEventListener('click', (ev) => {
  if (!editMode) return;
  const rect = mv.getBoundingClientRect();
  const x = ev.clientX - rect.left;
  const y = ev.clientY - rect.top;
  const hit = mv.positionAndNormalFromPoint(x, y);
  if (!hit) return;
  const p = hit.position, n = hit.normal;
  const snippet = {
    id: 'hotspot-new', label: 'New Feature', description: 'Describe this feature.',
    position: [+p.x.toFixed(5), +p.y.toFixed(5), +p.z.toFixed(5)],
    normal: [+n.x.toFixed(3), +n.y.toFixed(3), +n.z.toFixed(3)]
  };
  editOutput.value = JSON.stringify(snippet, null, 2);
});

async function loadHotspots() {
  try {
    const res = await fetch('../hotspots/hotspots-21224-assembly.json');
    const hotspots = await res.json();
    hotspots.forEach(h => addHotspot(h));
  } catch (e) { console.error('Failed to load hotspots', e); }
}

function addHotspot(h) {
  const btn = document.createElement('button');
  btn.className = 'hotspot';
  btn.slot = `hotspot-${h.id}`;
  btn.dataset.position = h.position.join(' ');
  btn.dataset.normal = h.normal.join(' ');
  btn.setAttribute('aria-label', h.label);
  const label = document.createElement('div');
  label.className = 'hotspot-label';
  label.innerHTML = `<strong>${h.label}</strong><span>${h.description || ''}</span>`;
  btn.appendChild(label);
  btn.addEventListener('click', (e) => {
    e.stopPropagation();
    document.querySelectorAll('.hotspot').forEach(el => { if (el !== btn) el.classList.remove('expanded'); });
    btn.classList.toggle('expanded');
  });
  mv.appendChild(btn);
}
loadHotspots();
</script>
</body>
</html>
